<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:20px;color:#171717;background:#fff;font-variant-numeric:tabular-nums}
button,input,select{font-family:inherit}
a{color:#171717}
:focus-visible{outline:2px solid #171717;outline-offset:2px}

.b1{border:0;background:#171717;color:#fff}.b1:hover{background:#262626}.b1:disabled{background:#A3A3A3;cursor:default}

.mxc:hover{box-shadow:0 0 0 1px #171717}

.sw{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:6px}

<script>

'use strict';

function avg(a,f){var s=0;a.forEach(function(x){s+=f(x);});return a.length?s/a.length:0;}

/* ---------- geometry ---------- */
function ringHas(ring,x,y){var ins=false;for(var i=0,j=ring.length-1;i<ring.length;j=i++){var xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins;}return ins;}

function inLake(lon,lat){return LAKES.some(function(L){var dx=(lon-L.lon)*111.32*Math.cos(L.lat*Math.PI/180),dy=(lat-L.lat)*110.57;return (dx/L.a)*(dx/L.a)+(dy/L.b)*(dy/L.b)<=1;});}

function realMask(adm1,adm2){
var naryn=adm1.features.filter(function(f){return norm(f.properties.shapeName).indexOf('naryn')>=0;})[0];if(!naryn)return null;

var d2=(adm2?adm2.features:[]).map(function(f){return {f:f,n:norm(f.properties.shapeName),bb:bboxOf(f.geometry)};});
var m={},used={},c,r;
for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){var p=cellCenter(c,r),lon=p[0],lat=p[1];

d=n.indexOf('bash')>=0?'AT':(n.indexOf('jumgal')>=0||n.indexOf('dzhumgal')>=0||n.indexOf('djumgal')>=0)?'JU':n.indexOf('kochkor')>=0?'KO':n.indexOf('tala')>=0?'AK':'NA';break;}m[c+','+r]=d;}

else if(a==='sug'){var s=SUG[+v];if(s)goTo(s.lon,s.lat);}

else if(a==='tnext'){tourGo(S.tour+1);}
else if(a==='tback'){tourGo(S.tour-1);}
else if(a==='tend'){S.tour=0;S.f=null;refresh();}});

/* ---------- map ---------- */
function status(t){var el=$('#status');if(!t){el.hidden=true;return;}el.hidden=false;el.textContent=t;}
if(typeof maplibregl==='undefined'){status('Could not load the map library. Check your internet connection and reload.');return;}
var CARTO=['a','b','c','d'];
map=new maplibregl.Map({container:'map',attributionControl:false,minZoom:5.5,maxZoom:11,bounds:[[73.4,40.45],[78.6,42.7]],fitBoundsOptions:{padding:{left:24,right:424,top:72,bottom:24}},dragRotate:false,pitchWithRotate:false,
style:{version:8,sources:{
base:{type:'raster',tiles:CARTO.map(function(s){return 'https://'+s+'.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}@2x.png';}),tileSize:256,attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors © <a href="https://carto.com/attributions" target="_blank">CARTO</a>'},
labels:{type:'raster',tiles:CARTO.map(function(s){return 'https://'+s+'.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}@2x.png';}),tileSize:256},
dem:{type:'raster-dem',tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],encoding:'terrarium',tileSize:256,maxzoom:12,attribution:'Terrain: <a href="https://registry.opendata.aws/terrain-tiles/" target="_blank">Mapzen / AWS Terrain Tiles</a>'}},
layers:[{id:'bg',type:'background',paint:{'background-color':'#F3F3F3'}},
{id:'base',type:'raster',source:'base',paint:{'raster-saturation':-1,'raster-contrast':-0.05}},
{id:'hill',type:'hillshade',source:'dem',paint:{'hillshade-exaggeration':0.45,'hillshade-shadow-color':'rgba(0,0,0,0.45)','hillshade-highlight-color':'rgba(255,255,255,0.6)','hillshade-accent-color':'rgba(0,0,0,0.15)','hillshade-illumination-direction':315}},
{id:'labels',type:'raster',source:'labels',paint:{'raster-saturation':-1,'raster-opacity':0.95}}]}});
map.addControl(new maplibregl.AttributionControl({compact:true,customAttribution:'Boundaries: <a href="https://www.geoboundaries.org" target="_blank">geoBoundaries</a> · Pasture data: sample'}),'bottom-left');
map.addControl(new maplibregl.ScaleControl({maxWidth:120,unit:'metric'}),'bottom-left');
map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-left');

map.on('load',function(){status('Loading oblast and district boundaries…');
Promise.all([fetchFirst(ADM1_URLS),fetchFirst(ADM2_URLS)]).then(function(res){
var rm=res[0]?realMask(res[0],res[1]):null;M=rm||approxMask();D=buildData(M);S.sel=D.demo;
var empty={type:'FeatureCollection',features:[]};
map.addSource('zones',{type:'image',url:renderZones(),coordinates:BOX});lastZonesKey=S.layer+'|'+S.f+'|'+S.dist;
map.addLayer({id:'zones',type:'raster',source:'zones',paint:{'raster-opacity':0.92,'raster-resampling':'linear','raster-fade-duration':0}},'labels');
map.addLayer({id:'hill2',type:'hillshade',source:'dem',paint:{'hillshade-exaggeration':0.3,'hillshade-shadow-color':'rgba(0,0,0,0.28)','hillshade-highlight-color':'rgba(255,255,255,0.25)','hillshade-accent-color':'rgba(0,0,0,0)','hillshade-illumination-direction':315}},'labels');
map.addSource('districts',{type:'geojson',data:{type:'FeatureCollection',features:M.districts}});
map.addLayer({id:'districts',type:'line',source:'districts',paint:{'line-color':'#737373','line-width':0.8,'line-dasharray':[3,2],'line-opacity':0.7}},'labels');
map.addSource('oblast',{type:'geojson',data:M.oblast?{type:'FeatureCollection',features:[M.oblast]}:empty});
map.addLayer({id:'oblast-halo',type:'line',source:'oblast',paint:{'line-color':'#FFFFFF','line-width':3.5,'line-opacity':0.9}},'labels');
map.addLayer({id:'oblast',type:'line',source:'oblast',paint:{'line-color':'#404040','line-width':1.4}},'labels');
map.addSource('ring',{type:'image',url:renderRing(null),coordinates:BOX});
map.addLayer({id:'ring',type:'raster',source:'ring',paint:{'raster-opacity':1,'raster-fade-duration':0}},'labels');
map.addSource('draw',{type:'geojson',data:empty});
map.addLayer({id:'draw-fill',type:'fill',source:'draw',filter:['==','$type','Polygon'],paint:{'fill-color':'#171717','fill-opacity':0.08}});
map.addLayer({id:'draw-line',type:'line',source:'draw',filter:['!=','$type','Point'],paint:{'line-color':'#171717','line-width':2}});
map.addLayer({id:'draw-pts',type:'circle',source:'draw',filter:['==','$type','Point'],paint:{'circle-radius':5,'circle-color':'#FFFFFF','circle-stroke-color':'#171717','circle-stroke-width':2}});
ready=true;
status(rm?'':'Live boundaries could not be loaded, so the study area outline is approximate.');
if(rm)setTimeout(function(){status('');},50);
refresh();});});
map.on('click',function(e){if(!D)return;var lon=e.lngLat.lng,lat=e.lngLat.lat;
if(S.drawing){S.pts=S.pts.concat([[lon,lat]]);refresh();return;}
var k=cellKeyOf(lat,lon);if(D.byKey[k]){S.sel=k;S.poly=null;refresh();}});
map.on('load',function(){map.getCanvas().style.cursor='pointer';});
var tileErr=0,tileOk=false;
map.on('data',function(e){if(e.sourceId==='base'&&e.tile)tileOk=true;});
map.on('error',function(e){var sid=e&&e.sourceId;if(sid==='base'||sid==='labels'){tileErr++;}});
setTimeout(function(){if(!tileOk&&tileErr>0)status('Map tiles from basemaps.cartocdn.com could not load. A firewall or VPN may be blocking them.');},10000);
}
